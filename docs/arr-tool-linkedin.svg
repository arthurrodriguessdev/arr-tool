<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title description">
  <title id="title">ARR Tool — toolkit Python para produtividade no desenvolvimento</title>
  <desc id="description">Diagrama em três camadas: CLI, motor de aplicação e integrações com Git, UUID, sockets, arquivos de ambiente e API de IA.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#b8d4c7" stroke-opacity=".055" stroke-width="1"/>
    </pattern>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d3ff68"/>
      <stop offset="1" stop-color="#a7e84e"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="#101c19"/>
  <rect width="1200" height="1200" fill="url(#grid)"/>
  <path d="M0 0H1200V18H0Z" fill="url(#accent)"/>
  <rect x="44" y="44" width="1112" height="1112" rx="18" fill="none" stroke="#b8d4c7" stroke-opacity=".18"/>

  <g font-family="Inter, Avenir, Helvetica, Arial, sans-serif">
    <rect x="80" y="82" width="12" height="12" rx="3" fill="#d3ff68"/>
    <text x="106" y="94" fill="#d3ff68" font-size="16" font-weight="700" letter-spacing="2">PYTHON DEVELOPER TOOLKIT</text>
    <text x="80" y="177" fill="#f3f3e9" font-size="70" font-weight="800" letter-spacing="-1">ARR <tspan fill="#d3ff68">TOOL</tspan></text>
    <text x="82" y="222" fill="#c4d0c9" font-size="25" font-weight="500">Pequenas ferramentas. Um fluxo mais leve.</text>
    <text x="1120" y="100" fill="#85988e" font-size="14" font-weight="600" text-anchor="end">01 / ARQUITETURA</text>

    <text x="80" y="292" fill="#85988e" font-size="14" font-weight="700" letter-spacing="2">DO COMANDO À EXECUÇÃO</text>

    <rect x="80" y="322" width="720" height="160" rx="12" fill="#192823" stroke="#668276" stroke-opacity=".58"/>
    <rect x="80" y="322" width="5" height="160" rx="2" fill="#d3ff68"/>
    <text x="108" y="356" fill="#d3ff68" font-size="13" font-weight="700" letter-spacing="1.6">01  /  INTERFACE</text>
    <text x="108" y="401" fill="#f3f3e9" font-size="32" font-weight="750">CLI</text>
    <text x="108" y="429" fill="#aebdb4" font-size="15">argparse · comandos diretos</text>
    <rect x="410" y="345" width="164" height="42" rx="6" fill="#263a31"/>
    <text x="427" y="372" fill="#dce7df" font-size="15" font-weight="600">commit-message</text>
    <rect x="586" y="345" width="172" height="42" rx="6" fill="#263a31"/>
    <text x="603" y="372" fill="#dce7df" font-size="15" font-weight="600">verify-port</text>
    <rect x="410" y="400" width="164" height="42" rx="6" fill="#263a31"/>
    <text x="427" y="427" fill="#dce7df" font-size="15" font-weight="600">uuid</text>
    <rect x="586" y="400" width="172" height="42" rx="6" fill="#263a31"/>
    <text x="603" y="427" fill="#dce7df" font-size="15" font-weight="600">env-example</text>

    <path d="M440 482V525" fill="none" stroke="#d3ff68" stroke-width="2"/>
    <path d="m434 517 6 8 6-8" fill="none" stroke="#d3ff68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="80" y="530" width="720" height="142" rx="12" fill="#192823" stroke="#668276" stroke-opacity=".58"/>
    <rect x="80" y="530" width="5" height="142" rx="2" fill="#d3ff68"/>
    <text x="108" y="565" fill="#d3ff68" font-size="13" font-weight="700" letter-spacing="1.6">02  /  APLICAÇÃO</text>
    <text x="108" y="616" fill="#f3f3e9" font-size="32" font-weight="750">Engine</text>
    <text x="270" y="604" fill="#aebdb4" font-size="16">application_engine.py</text>
    <text x="270" y="632" fill="#aebdb4" font-size="15">Orquestra as operações e direciona cada tarefa.</text>
    <rect x="680" y="566" width="87" height="62" rx="8" fill="#263a31"/>
    <text x="723.5" y="592" fill="#d3ff68" font-size="12" font-weight="700" text-anchor="middle">CORE</text>
    <text x="723.5" y="613" fill="#dce7df" font-size="13" text-anchor="middle">Python</text>

    <path d="M440 672V715" fill="none" stroke="#d3ff68" stroke-width="2"/>
    <path d="m434 707 6 8 6-8" fill="none" stroke="#d3ff68" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

    <rect x="80" y="720" width="720" height="192" rx="12" fill="#192823" stroke="#668276" stroke-opacity=".58"/>
    <rect x="80" y="720" width="5" height="192" rx="2" fill="#ff896e"/>
    <text x="108" y="756" fill="#ff896e" font-size="13" font-weight="700" letter-spacing="1.6">03  /  INTEGRAÇÕES</text>
    <text x="108" y="795" fill="#f3f3e9" font-size="22" font-weight="700">Adaptadores focados</text>
    <text x="108" y="824" fill="#aebdb4" font-size="15">Bibliotecas padrão e serviços externos</text>
    <path d="M440 833V854M440 854H213M440 854H372M440 854H531M440 854H690" fill="none" stroke="#668276" stroke-width="1.5"/>
    <circle cx="213" cy="854" r="4" fill="#ff896e"/>
    <circle cx="372" cy="854" r="4" fill="#ff896e"/>
    <circle cx="531" cy="854" r="4" fill="#ff896e"/>
    <circle cx="690" cy="854" r="4" fill="#ff896e"/>
    <text x="213" y="884" fill="#dce7df" font-size="15" font-weight="600" text-anchor="middle">Git</text>
    <text x="372" y="884" fill="#dce7df" font-size="15" font-weight="600" text-anchor="middle">UUID · socket</text>
    <text x="531" y="884" fill="#dce7df" font-size="15" font-weight="600" text-anchor="middle">.env</text>
    <text x="690" y="884" fill="#dce7df" font-size="15" font-weight="600" text-anchor="middle">Groq API</text>

    <rect x="832" y="322" width="288" height="590" rx="12" fill="#d3ff68"/>
    <text x="864" y="367" fill="#22321d" font-size="13" font-weight="800" letter-spacing="1.6">EM POUCAS LINHAS</text>
    <text x="864" y="444" fill="#101c19" font-size="57" font-weight="800">04</text>
    <text x="864" y="474" fill="#34452d" font-size="17" font-weight="600">comandos úteis</text>
    <path d="M864 504H1088" stroke="#718b43" stroke-opacity=".55"/>
    <text x="864" y="570" fill="#101c19" font-size="57" font-weight="800">01</text>
    <text x="864" y="600" fill="#34452d" font-size="17" font-weight="600">motor de aplicação</text>
    <path d="M864 630H1088" stroke="#718b43" stroke-opacity=".55"/>
    <text x="864" y="696" fill="#101c19" font-size="57" font-weight="800">3.10+</text>
    <text x="864" y="726" fill="#34452d" font-size="17" font-weight="600">Python</text>
    <rect x="864" y="775" width="224" height="93" rx="8" fill="#101c19"/>
    <text x="884" y="810" fill="#d3ff68" font-size="14" font-weight="700">SUGESTÃO, NÃO AUTOPILOTO</text>
    <text x="884" y="837" fill="#c4d0c9" font-size="13">A IA propõe. Você revisa.</text>
    <text x="884" y="856" fill="#c4d0c9" font-size="13">Nenhum commit automático.</text>

    <path d="M80 968H1120" stroke="#b8d4c7" stroke-opacity=".22"/>
    <text x="80" y="1018" fill="#f3f3e9" font-size="19" font-weight="700">ARR TOOL</text>
    <text x="80" y="1050" fill="#85988e" font-size="14">UTILITÁRIOS PARA O DIA A DIA DE DESENVOLVIMENTO</text>
    <rect x="80" y="1084" width="35" height="4" rx="2" fill="#d3ff68"/>
    <text x="1120" y="1021" fill="#d3ff68" font-size="15" font-weight="650" text-anchor="end">github.com/arthurrodriguessdev/arr-tool</text>
    <text x="1120" y="1052" fill="#85988e" font-size="13" text-anchor="end">PUBLIC REPOSITORY  /  PYTHON</text>
  </g>
</svg>
